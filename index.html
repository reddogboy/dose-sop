<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>DOSE Coffee | SOP & Recipes</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>

    <!-- Firebase SDK (Compat version สำหรับรันบน HTML ตรงๆ) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f9fafb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e5e7eb; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // =========================================================================
        // 🔥 FIREBASE CONFIGURATION (รหัสเชื่อมต่อ Cloud Database ของคุณ)
        // =========================================================================
        const firebaseConfig = {
          apiKey: "AIzaSyBPuTWgjVlHKmp3C14j6-Ogea3kv6poAU4",
          authDomain: "dose-sop.firebaseapp.com",
          projectId: "dose-sop",
          storageBucket: "dose-sop.firebasestorage.app",
          messagingSenderId: "2642010150",
          appId: "1:2642010150:web:da0906178f874d405ec6e7"
        };
        // =========================================================================

        // Initialize Firebase (Safely)
        let db = null;
        if (firebaseConfig) {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                console.log("🔥 Firebase Connected Successfully!");
            } catch (err) {
                console.error("Firebase init error:", err);
            }
        }

        // --- Helper สำหรับ LocalStorage (ระบบสำรอง Offline) ---
        function safeStorageGet(key, fallbackValue) {
            try { return localStorage.getItem(key) ? JSON.parse(localStorage.getItem(key)) : fallbackValue; } 
            catch (e) { return fallbackValue; }
        }

        // --- Mock Data ---
        const initialCategories = ['Coffee (Milk)', 'Coffee (Clear)', 'Tea', 'Non-Coffee', 'Bakery', 'Opening', 'Closing', 'Cleaning'];
        const initialIngredientsMaster = ['Espresso Shot', 'นมเย็นจัด', 'นมสด', 'ไซรัปวานิลลา', 'น้ำแข็ง', 'ผ้าเช็ดบาร์'];
        const initialStaff = [{id: 1, name: 'บอย (Head)'}, {id: 2, name: 'จอย (Barista)'}];
        const initialItems = [{ id: 1, type: 'recipe', category: 'Coffee (Milk)', name: 'DOSE Signature', ingredients: [{name: 'นมเย็นจัด', amount: '90ml'}, {name: 'Espresso', amount: '18g'}], steps: 'สกัดช็อตท็อปบนผิวนม' }];

        function App() {
            // --- 🔐 SYSTEM: Login / Store Code State ---
            const [storeCode, setStoreCode] = useState(() => localStorage.getItem('dose_store_code') || '');
            const [isLogged, setIsLogged] = useState(() => !!localStorage.getItem('dose_store_code'));
            const [loginInput, setLoginInput] = useState('');
            const [isOnlineMode, setIsOnlineMode] = useState(!!db);

            // --- 📦 SYSTEM: Data State ---
            const [activeTab, setActiveTab] = useState('recipes'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('All');

            const [items, setItems] = useState(() => safeStorageGet('dose_sop_data_v9', initialItems));
            const [categories, setCategories] = useState(() => safeStorageGet('dose_categories_v9', initialCategories));
            const [masterIngredients, setMasterIngredients] = useState(() => safeStorageGet('dose_ingredients_v9', initialIngredientsMaster));
            const [staffList, setStaffList] = useState(() => safeStorageGet('dose_staff_v9', initialStaff));
            const [queue, setQueue] = useState(() => safeStorageGet('dose_queue_v9', []));

            // UI State
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [formData, setFormData] = useState({ name: '', category: '', ingredients: [{ name: '', amount: '' }], steps: '' });
            const [assigningItem, setAssigningItem] = useState(null);

            // ---------------------------------------------------------
            // ☁️ CLOUD SYNC LOGIC (The Magic Happens Here)
            // ---------------------------------------------------------
            useEffect(() => {
                if (isLogged && db && storeCode) {
                    // Subscribe เพื่อฟังการเปลี่ยนแปลงจาก Cloud แบบ Real-time
                    const docRef = db.collection('stores').doc(storeCode);
                    
                    const unsubscribe = docRef.onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.items) setItems(data.items);
                            if (data.categories) setCategories(data.categories);
                            if (data.staffList) setStaffList(data.staffList);
                            if (data.queue) setQueue(data.queue);
                        } else {
                            // ถ้าร้านนี้เพิ่งสร้างใหม่ เอาระบบตั้งต้นดันขึ้น Cloud
                            docRef.set({ items, categories, staffList, queue, createdAt: new Date() });
                        }
                    });
                    return () => unsubscribe(); // Cleanup เมื่อปิดหน้าเว็บ
                } else if (isLogged) {
                    // 💾 OFFLINE MODE: Save to LocalStorage ถ้ายกเลิก/ไม่มี Firebase
                    localStorage.setItem('dose_sop_data_v9', JSON.stringify(items));
                    localStorage.setItem('dose_categories_v9', JSON.stringify(categories));
                    localStorage.setItem('dose_staff_v9', JSON.stringify(staffList));
                    localStorage.setItem('dose_queue_v9', JSON.stringify(queue));
                }
            }, [isLogged, storeCode, db]); 

            // ฟังก์ชันดันข้อมูลขึ้น Cloud 
            const syncToCloud = (payload) => {
                if (isLogged && db && storeCode) {
                    db.collection('stores').doc(storeCode).update(payload).catch(err => console.error("Sync Error:", err));
                }
            };

            // ---------------------------------------------------------

            // 🔐 ล็อกอิน
            const handleLogin = (e) => {
                e.preventDefault();
                const code = loginInput.trim().toUpperCase();
                if (code.length < 4) return alert("รหัสร้านต้องมี 4 ตัวอักษรขึ้นไป");
                
                localStorage.setItem('dose_store_code', code);
                setStoreCode(code);
                setIsLogged(true);
            };

            const handleLogout = () => {
                if(window.confirm('คุณต้องการออกจากระบบร้านค้านี้ใช่หรือไม่?')) {
                    localStorage.removeItem('dose_store_code');
                    setStoreCode('');
                    setIsLogged(false);
                }
            };

            // --- Handlers (ประยุกต์ใช้ Cloud Sync) ---
            const saveItem = (e) => {
                e.preventDefault();
                const cleanIngredients = formData.ingredients.filter(ing => ing.name && ing.name.trim() !== '');
                const newItem = { ...formData, name: formData.name.trim() || 'รายการไม่มีชื่อ', category: formData.category || 'ไม่ระบุ', ingredients: cleanIngredients, id: editingItem || Date.now(), type: activeTab === 'recipes' ? 'recipe' : 'task' };
                
                let newItemsList;
                if (editingItem) newItemsList = items.map(item => item.id === editingItem ? newItem : item);
                else newItemsList = [newItem, ...items];
                
                setItems(newItemsList);
                syncToCloud({ items: newItemsList }); 
                setIsModalOpen(false);
            };

            const executeDelete = (id) => { 
                const newItems = items.filter(item => item.id !== id);
                setItems(newItems); 
                syncToCloud({ items: newItems });
            };

            const addToQueue = (staffId) => {
                const staff = staffList.find(s => s.id === staffId);
                const newQueueItem = { qId: Date.now(), item: assigningItem, staffName: staff ? staff.name : 'ไม่ระบุ', status: 'pending', timestamp: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) };
                const newQueue = [newQueueItem, ...queue];
                setQueue(newQueue);
                syncToCloud({ queue: newQueue });
                setAssigningItem(null); setActiveTab('queue');
            };

            const markQueueDone = (qId) => {
                const newQueue = queue.map(q => q.qId === qId ? { ...q, status: 'done' } : q);
                setQueue(newQueue);
                syncToCloud({ queue: newQueue });
            };

            // ---------------------------------------------------------
            // 🖥️ UI RENDER: หน้าจอ Login (บังเกิดก่อนเข้าแอป)
            // ---------------------------------------------------------
            if (!isLogged) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-white max-w-md w-full rounded-3xl p-8 shadow-2xl text-center">
                            <div className="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <span className="text-4xl">☕</span>
                            </div>
                            <h1 className="text-3xl font-black text-slate-800 mb-2">DOSE SOP</h1>
                            <p className="text-slate-500 mb-8 font-medium">กรุณาใส่ "รหัสสาขา" เพื่อเชื่อมต่อข้อมูล</p>
                            
                            <form onSubmit={handleLogin}>
                                <input 
                                    type="text" 
                                    value={loginInput} 
                                    onChange={e => setLoginInput(e.target.value)}
                                    placeholder="เช่น DOSE999" 
                                    className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-xl font-bold uppercase focus:border-amber-500 outline-none mb-4 tracking-widest"
                                    required
                                />
                                <button type="submit" className="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-black text-lg shadow-lg transition-all">
                                    เข้าสู่ระบบ
                                </button>
                            </form>
                            <p className="text-xs text-slate-400 mt-6">
                                พนักงานที่ใช้รหัสสาขาเดียวกัน จะเห็นข้อมูลอัปเดตตรงกันทันที
                            </p>
                        </div>
                    </div>
                );
            }

            // ---------------------------------------------------------
            // 🖥️ UI RENDER: แอปพลิเคชันหลัก (เมื่อล็อกอินแล้ว)
            // ---------------------------------------------------------
            const filteredItems = items.filter(item => (activeTab === 'recipes' ? item.type === 'recipe' : item.type === 'task') && (selectedCategoryFilter === 'All' || item.category === selectedCategoryFilter));

            return (
                <div className="min-h-screen pb-24 animate-fade-in">
                    {/* Header Bar */}
                    <div className="glass-header sticky top-0 z-10 px-4 py-3 md:px-8 flex justify-between items-center shadow-sm">
                        <div>
                            <h1 className="text-xl font-black text-amber-800 tracking-tight flex items-center gap-2">
                                ☕ DOSE 
                                {isOnlineMode ? 
                                    <span className="bg-green-100 text-green-700 text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider font-bold">Cloud Sync</span> : 
                                    <span className="bg-slate-200 text-slate-500 text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider font-bold">Offline Mode</span>
                                }
                            </h1>
                            <p className="text-xs font-bold text-slate-500 mt-1">สาขา: <span className="text-slate-800">{storeCode}</span></p>
                        </div>
                        <button onClick={handleLogout} className="text-xs font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-lg hover:bg-red-100">
                            ออกระบบ
                        </button>
                    </div>

                    {!isOnlineMode && (
                        <div className="bg-amber-100 text-amber-800 p-3 text-xs font-bold text-center border-b border-amber-200">
                            ⚠️ ขณะนี้คุณกำลังใช้งานแบบ Offline เกิดข้อผิดพลาดในการเชื่อมต่อ Firebase
                        </div>
                    )}

                    {/* Navigation Tabs */}
                    <div className="max-w-5xl mx-auto px-4 mt-6">
                        <div className="flex bg-slate-200 p-1.5 rounded-xl overflow-x-auto hide-scrollbar mb-5">
                            <button onClick={() => {setActiveTab('recipes'); setSelectedCategoryFilter('All');}} className={`flex-1 min-w-[100px] py-2.5 rounded-lg font-bold text-sm transition-all ${activeTab === 'recipes' ? 'bg-white text-amber-800 shadow' : 'text-slate-500'}`}>📖 สูตร</button>
                            <button onClick={() => {setActiveTab('tasks'); setSelectedCategoryFilter('All');}} className={`flex-1 min-w-[100px] py-2.5 rounded-lg font-bold text-sm transition-all ${activeTab === 'tasks' ? 'bg-white text-indigo-700 shadow' : 'text-slate-500'}`}>✅ หน้าที่</button>
                            <button onClick={() => setActiveTab('queue')} className={`flex-1 min-w-[100px] py-2.5 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 ${activeTab === 'queue' ? 'bg-white text-red-600 shadow' : 'text-slate-500'}`}>
                                🔔 คิวงาน {queue.filter(q => q.status === 'pending').length > 0 && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">{queue.filter(q => q.status === 'pending').length}</span>}
                            </button>
                        </div>

                        {/* --- QUEUE VIEW --- */}
                        {activeTab === 'queue' && (
                            <div className="space-y-4 animate-slide-up">
                                {queue.filter(q => q.status === 'pending').map(q => (
                                    <div key={q.qId} className="bg-white p-4 rounded-xl border-l-8 border-l-amber-500 shadow-sm flex items-center justify-between">
                                        <div>
                                            <h3 className="font-black text-slate-800">{q.item?.name}</h3>
                                            <p className="text-xs font-bold text-slate-500">รับผิดชอบ: {q.staffName} | {q.timestamp}</p>
                                        </div>
                                        <button onClick={() => markQueueDone(q.qId)} className="w-12 h-12 bg-green-100 text-green-600 rounded-xl font-bold text-xl hover:bg-green-500 hover:text-white">✓</button>
                                    </div>
                                ))}
                                {queue.filter(q => q.status === 'pending').length === 0 && <div className="text-center py-10 text-slate-400 font-bold">ไม่มีคิวงานปัจจุบัน</div>}
                            </div>
                        )}

                        {/* --- ITEM GRID VIEW --- */}
                        {activeTab !== 'queue' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 animate-slide-up">
                                {filteredItems.map(item => (
                                    <div key={item.id} className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                                        <div className="flex justify-between items-start mb-3">
                                            <h3 className="font-black text-lg text-slate-800">{item.name}</h3>
                                            <button onClick={() => executeDelete(item.id)} className="text-red-400 hover:text-red-600 text-sm font-bold">ลบ</button>
                                        </div>
                                        <div className="bg-slate-50 p-3 rounded-lg text-sm mb-3">
                                            <span className="font-bold">สิ่งที่ต้องเตรียม: </span>
                                            {item.ingredients.map(i => i.name).join(', ')}
                                        </div>
                                        <p className="text-sm text-slate-600 whitespace-pre-line mb-4">{item.steps}</p>
                                        <button onClick={() => setAssigningItem(item)} className="w-full py-2 bg-slate-800 text-white rounded-lg font-bold text-sm">
                                            👉 ส่งเข้าคิว
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* ASSIGN MODAL */}
                    {assigningItem && (
                        <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm p-5 animate-slide-up">
                                <h3 className="text-lg font-black mb-4">มอบหมายให้ใคร?</h3>
                                <div className="space-y-2">
                                    {staffList.map(staff => (
                                        <button key={staff.id} onClick={() => addToQueue(staff.id)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold text-left hover:border-amber-500">
                                            {staff.name}
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setAssigningItem(null)} className="w-full mt-4 py-3 bg-slate-200 rounded-xl font-bold">ยกเลิก</button>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
