<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- ป้องกันการซูมหน้าจออัตโนมัติบน iPad/iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>DOSE Coffee | SOP & Recipes</title>
    
    <!-- 1. โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. โหลด React & ReactDOM (ล็อคเวอร์ชัน 18.2.0 ให้เสถียรที่สุด) -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 3. โหลด Babel สำหรับแปลงโค้ด JSX (ล็อคเวอร์ชัน 7) -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

    <style>
        body { background-color: #f9fafb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e5e7eb; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        /* อนิเมชันเด้งขึ้นมานุ่มๆ */
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Mock Data ---
        const initialCategories = ['Coffee (Milk)', 'Coffee (Clear)', 'Tea', 'Non-Coffee', 'Bakery', 'Opening', 'Closing', 'Cleaning'];
        const initialIngredientsMaster = ['Espresso Shot', 'นมเย็นจัด', 'นมโอ๊ต', 'นมสด', 'ไซรัปวานิลลา', 'ไซรัปคาราเมล', 'น้ำส้ม Yuzu', 'โซดา', 'น้ำแข็ง', 'ผงมัทฉะ', 'ครัวซองต์เนยสด', 'กุญแจร้าน', 'เครื่องชงกาแฟ', 'ผงทำความสะอาด', 'ผ้าเช็ดบาร์', 'เครื่องคิดเงิน'];
        const initialStaff = [{id: 1, name: 'บอย (Head Barista)'}, {id: 2, name: 'แนน (Cashier)'}, {id: 3, name: 'จอย (Barista)'}];

        const initialItems = [
            { id: 1, type: 'recipe', category: 'Coffee (Milk)', name: 'DOSE Signature Dirty', prepTime: '2 mins', ingredients: [{name: 'นมเย็นจัด', amount: '90ml'}, {name: 'Espresso Shot', amount: '18g'}, {name: 'ไซรัปวานิลลา', amount: '5ml'}], steps: '1. แช่แก้วให้เย็นจัด\n2. เทไซรัปและนมลงในแก้ว\n3. สกัดช็อต Ristretto ให้ไหลท็อปบนผิวนมเบาๆ\n4. เสิร์ฟทันที (ห้ามคน)' },
            { id: 2, type: 'recipe', category: 'Coffee (Clear)', name: 'Iced Yuzu Americano', prepTime: '1.5 mins', ingredients: [{name: 'Espresso Shot', amount: '18g'}, {name: 'น้ำส้ม Yuzu', amount: '45ml'}, {name: 'โซดา', amount: '100ml'}, {name: 'น้ำแข็ง', amount: 'เต็มแก้ว'}], steps: '1. ผสมน้ำส้ม Yuzu กับโซดาลงในแก้ว\n2. ใส่น้ำแข็ง\n3. เทช็อต Espresso ลงด้านบนให้แยกชั้น' },
            { id: 3, type: 'task', category: 'Opening', name: 'หน้าที่เปิดร้าน (Morning Shift)', prepTime: '07:00 - 08:00', ingredients: [{name: 'กุญแจร้าน', amount: '1 ดอก'}, {name: 'เครื่องชงกาแฟ', amount: 'พร้อมใช้งาน'}], steps: '1. เปิดแอร์และไฟโซนลูกค้า\n2. เปิดเครื่องชงกาแฟ (ไล่น้ำร้อน 1 รอบ)\n3. Calibrate เครื่องบดกาแฟ\n4. นับเงินทอนในลิ้นชัก' }
        ];

        function App() {
            // --- State Management ---
            const [activeTab, setActiveTab] = useState('recipes'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('All');

            // Databases (LocalStorage)
            const [items, setItems] = useState(() => JSON.parse(localStorage.getItem('dose_sop_data_v4')) || initialItems);
            const [categories, setCategories] = useState(() => JSON.parse(localStorage.getItem('dose_categories_v4')) || initialCategories);
            const [masterIngredients, setMasterIngredients] = useState(() => JSON.parse(localStorage.getItem('dose_ingredients_v4')) || initialIngredientsMaster);
            const [staffList, setStaffList] = useState(() => JSON.parse(localStorage.getItem('dose_staff_v4')) || initialStaff);
            const [queue, setQueue] = useState(() => JSON.parse(localStorage.getItem('dose_queue_v4')) || []);

            // Modals State
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [confirmDeleteId, setConfirmDeleteId] = useState(null);
            
            const [isFilterModalOpen, setIsFilterModalOpen] = useState(false);
            const [isStaffModalOpen, setIsStaffModalOpen] = useState(false);
            const [isCatManageModalOpen, setIsCatManageModalOpen] = useState(false);
            const [assigningItem, setAssigningItem] = useState(null);
            
            const [quickAddType, setQuickAddType] = useState(null); 
            const [quickAddValue, setQuickAddValue] = useState('');
            const [newStaffName, setNewStaffName] = useState('');
            const [newCatName, setNewCatName] = useState('');
            const [editingCatName, setEditingCatName] = useState(null);
            const [editingCatValue, setEditingCatValue] = useState('');

            // Form State
            const [formData, setFormData] = useState({ name: '', category: '', prepTime: '', ingredients: [{ name: '', amount: '' }], steps: '' });

            // Sync to LocalStorage
            useEffect(() => { localStorage.setItem('dose_sop_data_v4', JSON.stringify(items)); }, [items]);
            useEffect(() => { localStorage.setItem('dose_categories_v4', JSON.stringify(categories)); }, [categories]);
            useEffect(() => { localStorage.setItem('dose_ingredients_v4', JSON.stringify(masterIngredients)); }, [masterIngredients]);
            useEffect(() => { localStorage.setItem('dose_staff_v4', JSON.stringify(staffList)); }, [staffList]);
            useEffect(() => { localStorage.setItem('dose_queue_v4', JSON.stringify(queue)); }, [queue]);

            // --- Logic ---
            const filteredItems = useMemo(() => {
                let filtered = items.filter(item => (activeTab === 'recipes' ? item.type === 'recipe' : item.type === 'task'));
                if (selectedCategoryFilter !== 'All') filtered = filtered.filter(item => item.category === selectedCategoryFilter);
                if (searchQuery) filtered = filtered.filter(item => item.name.toLowerCase().includes(searchQuery.toLowerCase()));
                return filtered;
            }, [items, activeTab, searchQuery, selectedCategoryFilter]);

            // Handlers
            const openModal = (item = null) => {
                if (item) {
                    setEditingItem(item.id);
                    const safeIngredients = Array.isArray(item.ingredients) ? item.ingredients : [{name: item.ingredients, amount: ''}];
                    setFormData({ ...item, ingredients: safeIngredients });
                } else {
                    setEditingItem(null);
                    setFormData({ name: '', category: categories[0] || '', prepTime: '', ingredients: [{ name: '', amount: '' }], steps: '' });
                }
                setIsModalOpen(true);
            };

            const handleIngredientChange = (index, field, value) => {
                const newIngredients = [...formData.ingredients];
                newIngredients[index][field] = value;
                setFormData({ ...formData, ingredients: newIngredients });
            };

            const addIngredientRow = () => setFormData({ ...formData, ingredients: [...formData.ingredients, { name: '', amount: '' }] });
            const removeIngredientRow = (index) => setFormData({ ...formData, ingredients: formData.ingredients.filter((_, i) => i !== index) });

            const saveItem = (e) => {
                e.preventDefault();
                const cleanIngredients = formData.ingredients.filter(ing => ing.name.trim() !== '');
                const newItem = { ...formData, ingredients: cleanIngredients.length > 0 ? cleanIngredients : [{name: '-', amount: ''}], id: editingItem || Date.now(), type: activeTab === 'recipes' ? 'recipe' : 'task' };
                if (editingItem) setItems(items.map(item => item.id === editingItem ? newItem : item));
                else setItems([newItem, ...items]);
                setIsModalOpen(false);
            };

            const executeDelete = () => { setItems(items.filter(item => item.id !== confirmDeleteId)); setConfirmDeleteId(null); };

            const addStaff = () => { if (newStaffName.trim()) { setStaffList([...staffList, { id: Date.now(), name: newStaffName }]); setNewStaffName(''); } };
            const removeStaff = (id) => setStaffList(staffList.filter(s => s.id !== id));

            const addCategory = () => { if (newCatName.trim() && !categories.includes(newCatName.trim())) { setCategories([...categories, newCatName.trim()]); setNewCatName(''); } };
            const removeCategory = (catToRemove) => setCategories(categories.filter(c => c !== catToRemove));
            const saveEditCategory = () => {
                if (!editingCatValue.trim() || editingCatValue.trim() === editingCatName) return setEditingCatName(null);
                const newName = editingCatValue.trim();
                setCategories(categories.map(c => c === editingCatName ? newName : c));
                setItems(items.map(item => item.category === editingCatName ? { ...item, category: newName } : item));
                if (selectedCategoryFilter === editingCatName) setSelectedCategoryFilter(newName);
                setEditingCatName(null);
            };

            const addToQueue = (staffId) => {
                const staff = staffList.find(s => s.id === staffId);
                const newQueueItem = { qId: Date.now(), item: assigningItem, staffName: staff ? staff.name : 'ไม่มีผู้รับผิดชอบ', status: 'pending', timestamp: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) };
                setQueue([newQueueItem, ...queue]);
                setAssigningItem(null); setActiveTab('queue');
            };

            const markQueueDone = (qId) => setQueue(queue.map(q => q.qId === qId ? { ...q, status: 'done' } : q));
            const removeQueue = (qId) => setQueue(queue.filter(q => q.qId !== qId));

            // --- Render ---
            return (
                <div className="min-h-screen pb-24">
                    {/* Header */}
                    <div className="glass-header sticky top-0 z-10 px-4 py-4 md:px-8 flex justify-between items-center shadow-sm">
                        <div>
                            <h1 className="text-2xl font-black text-amber-800 tracking-tight">☕ DOSE SOP</h1>
                            <p className="text-xs font-bold text-slate-500 uppercase tracking-widest mt-1">SOP & Task System</p>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setIsCatManageModalOpen(true)} className="bg-white border-2 border-slate-200 text-slate-600 p-2 md:px-4 md:py-2 rounded-xl font-bold hover:border-amber-400 hover:text-amber-600 transition-colors shadow-sm flex items-center gap-2">
                                📁 <span className="hidden md:inline">หมวดหมู่</span>
                            </button>
                            <button onClick={() => setIsStaffModalOpen(true)} className="bg-white border-2 border-slate-200 text-slate-600 p-2 md:px-4 md:py-2 rounded-xl font-bold hover:border-indigo-400 hover:text-indigo-600 transition-colors shadow-sm flex items-center gap-2">
                                👥 <span className="hidden md:inline">พนักงาน</span>
                            </button>
                        </div>
                    </div>

                    <div className="max-w-5xl mx-auto px-4 mt-6 space-y-5">
                        {/* Tabs */}
                        <div className="flex bg-slate-200 p-1.5 rounded-xl overflow-x-auto hide-scrollbar">
                            <button onClick={() => {setActiveTab('recipes'); setSelectedCategoryFilter('All');}} className={`flex-1 min-w-[120px] py-2.5 rounded-lg font-bold text-sm transition-all ${activeTab === 'recipes' ? 'bg-white text-amber-800 shadow' : 'text-slate-500 hover:bg-slate-300/50'}`}>📖 สูตรเครื่องดื่ม</button>
                            <button onClick={() => {setActiveTab('tasks'); setSelectedCategoryFilter('All');}} className={`flex-1 min-w-[120px] py-2.5 rounded-lg font-bold text-sm transition-all ${activeTab === 'tasks' ? 'bg-white text-indigo-700 shadow' : 'text-slate-500 hover:bg-slate-300/50'}`}>✅ หน้าที่ปฏิบัติงาน</button>
                            <button onClick={() => setActiveTab('queue')} className={`flex-1 min-w-[120px] py-2.5 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 ${activeTab === 'queue' ? 'bg-white text-red-600 shadow' : 'text-slate-500 hover:bg-slate-300/50'}`}>
                                🔔 คิวงาน {queue.filter(q => q.status === 'pending').length > 0 && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">{queue.filter(q => q.status === 'pending').length}</span>}
                            </button>
                        </div>

                        {/* Content Area */}
                        {activeTab === 'queue' ? (
                            <div className="space-y-4 animate-slide-up">
                                <div className="flex justify-between items-center mb-2">
                                    <h2 className="text-xl font-black text-slate-800">📋 คิวงานปัจจุบัน</h2>
                                    <button onClick={() => setQueue(queue.filter(q => q.status !== 'done'))} className="text-sm font-bold text-slate-400 hover:text-red-500">ล้างคิวที่เสร็จแล้ว</button>
                                </div>
                                {queue.length === 0 ? (
                                    <div className="py-16 text-center text-slate-400 font-medium bg-white rounded-2xl border-2 border-dashed border-slate-200">ไม่มีคิวงานค้างอยู่ 🎉</div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {queue.map(q => (
                                            <div key={q.qId} className={`p-4 rounded-2xl border-2 shadow-sm transition-all flex items-center gap-4 ${q.status === 'done' ? 'bg-slate-50 border-slate-200 opacity-60' : (q.item.type === 'recipe' ? 'bg-white border-amber-200 border-l-8 border-l-amber-500' : 'bg-white border-indigo-200 border-l-8 border-l-indigo-500')}`}>
                                                <div className="flex-1">
                                                    <div className="flex justify-between items-start mb-1">
                                                        <h3 className={`font-black text-lg ${q.status === 'done' ? 'line-through text-slate-400' : 'text-slate-800'}`}>{q.item.name}</h3>
                                                        <span className="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-1 rounded-md">{q.timestamp}</span>
                                                    </div>
                                                    <div className="flex gap-2 items-center text-sm font-bold">
                                                        <span className="text-slate-500">รับผิดชอบ:</span>
                                                        <span className="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-md">{q.staffName}</span>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    {q.status === 'pending' ? (
                                                        <button onClick={() => markQueueDone(q.qId)} className="w-12 h-12 bg-green-100 hover:bg-green-500 text-green-600 hover:text-white rounded-xl flex items-center justify-center text-2xl transition-colors shadow-sm">✓</button>
                                                    ) : (
                                                        <button onClick={() => removeQueue(q.qId)} className="w-12 h-12 bg-slate-200 hover:bg-red-500 text-slate-500 hover:text-white rounded-xl flex items-center justify-center text-xl transition-colors">🗑️</button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="animate-slide-up">
                                {/* Search & Filter Bar */}
                                <div className="flex flex-col md:flex-row gap-3 mb-4">
                                    <div className="relative flex-1">
                                        <span className="absolute left-4 top-3.5 text-slate-400">🔍</span>
                                        <input type="text" placeholder={`ค้นหา${activeTab === 'recipes' ? 'สูตรเครื่องดื่ม' : 'หน้าที่'}...`} value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full pl-12 pr-4 py-3 bg-white border-2 border-slate-200 rounded-xl focus:border-amber-500 outline-none font-medium shadow-sm" />
                                    </div>
                                    <button onClick={() => setIsFilterModalOpen(true)} className="flex items-center justify-between md:justify-center gap-2 px-5 py-3 bg-white border-2 border-slate-200 rounded-xl font-bold text-slate-700 hover:border-amber-500 hover:text-amber-700 transition-all shadow-sm whitespace-nowrap min-w-[180px]">
                                        <div className="flex items-center gap-2"><span>📁</span> <span className={selectedCategoryFilter !== 'All' ? 'text-amber-600' : ''}>{selectedCategoryFilter === 'All' ? 'ทุกหมวดหมู่' : selectedCategoryFilter}</span></div>
                                        <span className="text-xs text-slate-400">▼</span>
                                    </button>
                                </div>

                                {/* Item Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                    {filteredItems.length === 0 && (
                                        <div className="col-span-full py-16 text-center text-slate-400 font-medium bg-white rounded-2xl border-2 border-dashed border-slate-200">ไม่พบข้อมูล กรุณากดปุ่ม + เพื่อเพิ่มรายการ</div>
                                    )}
                                    {filteredItems.map(item => (
                                        <div key={item.id} className="bg-white rounded-2xl shadow-sm border border-slate-200 hover:shadow-lg transition-all relative overflow-hidden flex flex-col">
                                            <div className="p-5 border-b border-slate-100">
                                                <div className="absolute top-4 right-4 flex gap-1">
                                                    <button onClick={() => openModal(item)} className="p-1.5 text-slate-400 hover:text-blue-600 bg-slate-50 hover:bg-blue-50 rounded-lg transition-colors">✏️</button>
                                                    <button onClick={() => setConfirmDeleteId(item.id)} className="p-1.5 text-slate-400 hover:text-red-600 bg-slate-50 hover:bg-red-50 rounded-lg transition-colors">🗑️</button>
                                                </div>
                                                <div className={`inline-block px-3 py-1 rounded-full text-xs font-bold mb-3 ${activeTab === 'recipes' ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-800'}`}>{item.category}</div>
                                                <h3 className="text-xl font-black text-slate-800 mb-1 pr-16 leading-tight">{item.name}</h3>
                                                <p className="text-sm font-bold text-slate-500">⏱️ {item.prepTime}</p>
                                            </div>
                                            <div className="p-5 flex-1 flex flex-col gap-4">
                                                <div className={`p-4 rounded-xl border ${activeTab === 'recipes' ? 'bg-amber-50/50 border-amber-100' : 'bg-indigo-50/50 border-indigo-100'}`}>
                                                    <h4 className="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2"><span>📌</span> {activeTab === 'recipes' ? 'สิ่งที่ต้องเตรียม' : 'อุปกรณ์ที่ใช้'}</h4>
                                                    <ul className="grid grid-cols-1 gap-2">
                                                        {item.ingredients.map((ing, idx) => (
                                                            <li key={idx} className="flex justify-between items-center text-sm border-b border-slate-200/50 pb-1 last:border-0 last:pb-0">
                                                                <span className="font-semibold text-slate-700">{ing.name}</span>
                                                                <span className="text-slate-500 bg-white px-2 py-0.5 rounded text-xs border border-slate-200">{ing.amount}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>
                                                <div>
                                                    <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">{activeTab === 'recipes' ? 'วิธีทำ (Steps)' : 'ขั้นตอนปฏิบัติ'}</h4>
                                                    <div className="text-sm font-medium text-slate-700 whitespace-pre-line leading-relaxed">{item.steps || '-'}</div>
                                                </div>
                                            </div>
                                            <div className="p-3 border-t border-slate-100 bg-slate-50">
                                                <button onClick={() => setAssigningItem(item)} className={`w-full py-3 rounded-xl font-bold transition-all text-sm flex items-center justify-center gap-2 ${activeTab === 'recipes' ? 'bg-amber-100 text-amber-800 hover:bg-amber-500 hover:text-white' : 'bg-indigo-100 text-indigo-800 hover:bg-indigo-500 hover:text-white'}`}>
                                                    👉 ส่งเข้าคิว / มอบหมายงาน
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* FAB */}
                    {activeTab !== 'queue' && (
                        <button onClick={() => openModal()} className="fixed bottom-6 right-6 w-14 h-14 bg-slate-800 text-white rounded-full flex items-center justify-center shadow-lg shadow-slate-400/50 hover:bg-slate-700 hover:scale-105 transition-all text-2xl font-light z-40">
                            +
                        </button>
                    )}

                    {/* --- MODALS --- */}
                    
                    {/* Delete Confirmation Modal */}
                    {confirmDeleteId && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[80] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center animate-slide-up">
                                <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🗑️</div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">ลบรายการนี้?</h3>
                                <p className="text-slate-500 text-sm mb-6">คุณแน่ใจหรือไม่ว่าต้องการลบรายการนี้ ข้อมูลจะไม่สามารถกู้คืนได้</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmDeleteId(null)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200">ยกเลิก</button>
                                    <button onClick={executeDelete} className="flex-1 py-3 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600">ลบทิ้ง</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Filter Category Grid Modal */}
                    {isFilterModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[70] flex flex-col justify-end md:justify-center items-center p-0 md:p-4">
                            <div className="bg-white rounded-t-3xl md:rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col animate-slide-up">
                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h2 className="text-xl font-black text-slate-800">📁 เลือกหมวดหมู่</h2>
                                    <button onClick={() => setIsFilterModalOpen(false)} className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 w-8 h-8 rounded-full font-bold transition-colors">✕</button>
                                </div>
                                <div className="p-6 grid grid-cols-2 gap-3 max-h-[60vh] overflow-y-auto">
                                    <button 
                                        onClick={() => { setSelectedCategoryFilter('All'); setIsFilterModalOpen(false); }}
                                        className={`p-4 rounded-2xl border-2 text-center font-bold transition-all ${selectedCategoryFilter === 'All' ? 'border-amber-500 bg-amber-50 text-amber-700' : 'border-slate-200 text-slate-600 hover:border-slate-300'}`}
                                    >
                                        ทุกหมวดหมู่
                                    </button>
                                    {categories.map(cat => (
                                        <button 
                                            key={cat}
                                            onClick={() => { setSelectedCategoryFilter(cat); setIsFilterModalOpen(false); }}
                                            className={`p-4 rounded-2xl border-2 text-center font-bold transition-all flex flex-col items-center justify-center gap-1 ${selectedCategoryFilter === cat ? 'border-amber-500 bg-amber-50 text-amber-700' : 'border-slate-200 text-slate-600 hover:border-slate-300'}`}
                                        >
                                            {cat}
                                            {selectedCategoryFilter === cat && <span className="text-amber-500">✓</span>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Manage Categories Modal */}
                    {isCatManageModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[70] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col animate-slide-up">
                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h2 className="text-xl font-black text-slate-800">📁 จัดการหมวดหมู่</h2>
                                    <button onClick={() => setIsCatManageModalOpen(false)} className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 w-8 h-8 rounded-full font-bold transition-colors">✕</button>
                                </div>
                                <div className="p-5">
                                    <div className="flex gap-2 mb-6">
                                        <input type="text" value={newCatName} onChange={(e) => setNewCatName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addCategory()} className="flex-1 p-3 bg-white border-2 border-slate-200 rounded-lg focus:border-amber-500 outline-none" placeholder="ชื่อหมวดหมู่ใหม่" />
                                        <button onClick={addCategory} className="px-5 bg-amber-500 text-white font-bold rounded-lg hover:bg-amber-600">เพิ่ม</button>
                                    </div>
                                    <h4 className="text-sm font-bold text-slate-500 mb-3">รายชื่อหมวดหมู่ทั้งหมด</h4>
                                    <div className="space-y-2 max-h-[50vh] overflow-y-auto pr-1">
                                        {categories.map(cat => (
                                            <div key={cat} className="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-xl">
                                                {editingCatName === cat ? (
                                                    <div className="flex gap-2 flex-1 mr-2">
                                                        <input type="text" value={editingCatValue} onChange={(e) => setEditingCatValue(e.target.value)} className="flex-1 p-1 px-2 border-2 border-amber-300 rounded outline-none w-full" autoFocus />
                                                        <button onClick={saveEditCategory} className="text-white bg-green-500 px-3 py-1 rounded font-bold text-sm">เซฟ</button>
                                                        <button onClick={() => setEditingCatName(null)} className="text-slate-500 bg-slate-200 px-3 py-1 rounded font-bold text-sm">ยกเลิก</button>
                                                    </div>
                                                ) : (
                                                    <>
                                                        <span className="font-bold text-slate-700">{cat}</span>
                                                        <div className="flex gap-1">
                                                            <button onClick={() => { setEditingCatName(cat); setEditingCatValue(cat); }} className="text-blue-500 font-bold text-sm bg-blue-50 px-3 py-1 rounded-lg hover:bg-blue-100">แก้</button>
                                                            <button onClick={() => removeCategory(cat)} className="text-red-500 font-bold text-sm bg-red-50 px-3 py-1 rounded-lg hover:bg-red-100">ลบ</button>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Manage Staff Modal */}
                    {isStaffModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[70] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col animate-slide-up">
                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h2 className="text-xl font-black text-slate-800">👥 จัดการพนักงาน</h2>
                                    <button onClick={() => setIsStaffModalOpen(false)} className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 w-8 h-8 rounded-full font-bold transition-colors">✕</button>
                                </div>
                                <div className="p-5">
                                    <div className="flex gap-2 mb-6">
                                        <input type="text" value={newStaffName} onChange={(e) => setNewStaffName(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addStaff()} className="flex-1 p-3 bg-white border-2 border-slate-200 rounded-lg focus:border-indigo-500 outline-none" placeholder="ชื่อพนักงาน (เช่น จอย Barista)" />
                                        <button onClick={addStaff} className="px-5 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700">เพิ่ม</button>
                                    </div>
                                    <h4 className="text-sm font-bold text-slate-500 mb-3">รายชื่อพนักงาน</h4>
                                    <div className="space-y-2 max-h-60 overflow-y-auto">
                                        {staffList.map(staff => (
                                            <div key={staff.id} className="flex justify-between items-center p-3 bg-slate-50 border border-slate-200 rounded-xl">
                                                <span className="font-bold text-slate-700">{staff.name}</span>
                                                <button onClick={() => removeStaff(staff.id)} className="text-red-500 font-bold text-sm bg-red-50 px-3 py-1 rounded-lg hover:bg-red-100">ลบ</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Assign Task to Queue Modal */}
                    {assigningItem && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[70] flex items-end md:items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-slide-up">
                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h3 className="text-lg font-black text-slate-800">ส่งเข้าคิว: {assigningItem.name}</h3>
                                    <button onClick={() => setAssigningItem(null)} className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 w-8 h-8 rounded-full font-bold transition-colors">✕</button>
                                </div>
                                <div className="p-5">
                                    <p className="text-sm font-bold text-slate-500 mb-4">ระบุผู้รับผิดชอบ (Assign to):</p>
                                    <div className="grid grid-cols-1 gap-2 max-h-60 overflow-y-auto">
                                        {staffList.map(staff => (
                                            <button key={staff.id} onClick={() => addToQueue(staff.id)} className="p-4 bg-white border-2 border-slate-200 rounded-xl font-bold text-slate-700 hover:border-indigo-500 hover:text-indigo-700 text-left flex justify-between items-center transition-all">
                                                {staff.name} <span className="text-slate-300">👉</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add/Edit Item Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-slide-up">
                                <div className="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h2 className="text-xl font-black text-slate-800">{editingItem ? '✏️ แก้ไขรายการ' : (activeTab === 'recipes' ? '☕ เพิ่มสูตรใหม่' : '✅ เพิ่มหน้าที่ใหม่')}</h2>
                                    <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-slate-600 bg-slate-200 hover:bg-slate-300 w-8 h-8 rounded-full font-bold transition-colors">✕</button>
                                </div>
                                <form onSubmit={saveItem} className="p-6 space-y-5 overflow-y-auto hide-scrollbar">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">ชื่อรายการ</label>
                                            <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full p-3 bg-white border-2 border-slate-200 rounded-lg focus:border-amber-500 outline-none" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">{activeTab === 'recipes' ? 'เวลาเตรียม' : 'ช่วงเวลา'}</label>
                                            <input type="text" required value={formData.prepTime} onChange={e => setFormData({...formData, prepTime: e.target.value})} className="w-full p-3 bg-white border-2 border-slate-200 rounded-lg focus:border-amber-500 outline-none" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">หมวดหมู่ (Category)</label>
                                        <select required value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full p-3 bg-white border-2 border-slate-200 rounded-lg focus:border-amber-500 outline-none">
                                            <option value="" disabled>-- เลือกหมวดหมู่ --</option>
                                            {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                        </select>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <div className="flex justify-between items-center mb-3">
                                            <label className="block text-sm font-bold text-slate-700">{activeTab === 'recipes' ? 'รายการส่วนผสม' : 'รายการอุปกรณ์'}</label>
                                        </div>
                                        {formData.ingredients.map((ing, index) => (
                                            <div key={index} className="flex gap-2 mb-2 items-start">
                                                <select value={ing.name} onChange={(e) => handleIngredientChange(index, 'name', e.target.value)} className="flex-[2] p-2.5 bg-white border border-slate-300 rounded-lg outline-none text-sm" required>
                                                    <option value="" disabled>เลือกส่วนผสม</option>
                                                    {masterIngredients.map(mIng => <option key={mIng} value={mIng}>{mIng}</option>)}
                                                </select>
                                                <input type="text" value={ing.amount} onChange={(e) => handleIngredientChange(index, 'amount', e.target.value)} className="flex-1 p-2.5 bg-white border border-slate-300 rounded-lg outline-none text-sm" placeholder="ปริมาณ" />
                                                <button type="button" onClick={() => removeIngredientRow(index)} className="p-2.5 text-slate-400 hover:text-red-500 bg-white border border-slate-200 rounded-lg">✕</button>
                                            </div>
                                        ))}
                                        <button type="button" onClick={addIngredientRow} className="mt-2 text-sm font-bold text-amber-600 hover:text-amber-700">+ เพิ่มบรรทัดส่วนผสม</button>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">{activeTab === 'recipes' ? 'วิธีทำ (Steps)' : 'ขั้นตอนปฏิบัติ'}</label>
                                        <textarea value={formData.steps} onChange={e => setFormData({...formData, steps: e.target.value})} className="w-full p-3 bg-white border-2 border-slate-200 rounded-lg focus:border-amber-500 outline-none min-h-[100px]"></textarea>
                                    </div>
                                    <div className="pt-4 border-t border-slate-100 flex gap-3">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200">ยกเลิก</button>
                                        <button type="submit" className="flex-1 py-3 bg-amber-500 text-white font-bold rounded-xl hover:bg-amber-600 shadow-md">💾 บันทึกข้อมูล</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- Error Boundary ---
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-slate-100 p-4">
                            <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border-t-8 border-red-500">
                                <div className="text-6xl mb-4">🚨</div>
                                <h1 className="text-2xl font-black text-slate-800 mb-2">ระบบขัดข้อง</h1>
                                <p className="text-slate-500 mb-6 text-sm">การก๊อปปี้โค้ดอาจเกิดความผิดพลาด กรุณารีเซ็ตระบบเพื่อเริ่มต้นใหม่</p>
                                <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="w-full py-3 bg-red-50 text-red-600 font-bold rounded-xl border border-red-200">🗑️ ล้างข้อมูลและรีเฟรช</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
