<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>DOSE Coffee | SOP & Recipes</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>

    <!-- Firebase SDK (Compat version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #f9fafb; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #e5e7eb; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDownToast { from { transform: translate(-50%, -20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-toast { animation: slideDownToast 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // =========================================================================
        // 🔥 FIREBASE CONFIG (คงค่าเดิมของคุณไว้)
        // =========================================================================
        const firebaseConfig = {
          apiKey: "AIzaSyBPuTWgjVlHKmp3C14j6-Ogea3kv6poAU4",
          authDomain: "dose-sop.firebaseapp.com",
          projectId: "dose-sop",
          storageBucket: "dose-sop.firebasestorage.app",
          messagingSenderId: "2642010150",
          appId: "1:2642010150:web:da0906178f874d405ec6e7"
        };
        // =========================================================================

        let db = null;
        if (firebaseConfig) {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                console.log("🔥 Firebase Connected Successfully!");
            } catch (err) { console.error("Firebase init error:", err); }
        }

        function safeStorageGet(key, fallbackValue) {
            try { return localStorage.getItem(key) ? JSON.parse(localStorage.getItem(key)) : fallbackValue; } 
            catch (e) { return fallbackValue; }
        }

        const initialCategories = ['Coffee (Milk)', 'Coffee (Clear)', 'Tea', 'Non-Coffee', 'Bakery', 'Opening', 'Closing'];
        const initialIngredientsMaster = ['Espresso Shot', 'นมเย็นจัด', 'ไซรัปวานิลลา', 'น้ำแข็ง', 'ผ้าเช็ดบาร์'];
        const initialStaff = [{id: 1, name: 'บอย (Head)'}, {id: 2, name: 'จอย (Barista)'}];
        const initialItems = [{ id: 1, type: 'recipe', category: 'Coffee (Milk)', name: 'DOSE Signature', ingredients: [{name: 'นมเย็นจัด', amount: '90ml'}, {name: 'Espresso', amount: '18g'}], steps: 'สกัดช็อตท็อปบนผิวนม' }];

        function App() {
            // --- 🔐 SYSTEM: Login State ---
            const [storeCode, setStoreCode] = useState(() => localStorage.getItem('dose_store_code') || '');
            const [isLogged, setIsLogged] = useState(() => !!localStorage.getItem('dose_store_code'));
            const [loginInput, setLoginInput] = useState('');
            const [isOnlineMode, setIsOnlineMode] = useState(!!db);

            // --- 📦 SYSTEM: Data State ---
            const [activeTab, setActiveTab] = useState('recipes'); 
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategoryFilter, setSelectedCategoryFilter] = useState('All');
            const [queueStaffFilter, setQueueStaffFilter] = useState('All');

            const [items, setItems] = useState(() => safeStorageGet('dose_sop_data_v9', initialItems));
            const [categories, setCategories] = useState(() => safeStorageGet('dose_categories_v9', initialCategories));
            const [masterIngredients, setMasterIngredients] = useState(() => safeStorageGet('dose_ingredients_v9', initialIngredientsMaster));
            const [staffList, setStaffList] = useState(() => safeStorageGet('dose_staff_v9', initialStaff));
            const [queue, setQueue] = useState(() => safeStorageGet('dose_queue_v9', []));

            // 🌟 NEW: State สำหรับจัดการการกาง/หด ของรายละเอียดคิวงาน (Local State)
            const [expandedQIds, setExpandedQIds] = useState([]);

            // Modals & UI States
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const [confirmDeleteId, setConfirmDeleteId] = useState(null);
            const [isFilterModalOpen, setIsFilterModalOpen] = useState(false);
            const [isStaffModalOpen, setIsStaffModalOpen] = useState(false);
            const [isCatManageModalOpen, setIsCatManageModalOpen] = useState(false);
            const [isIngManageModalOpen, setIsIngManageModalOpen] = useState(false);
            const [assigningItem, setAssigningItem] = useState(null);
            const [toast, setToast] = useState(null);

            // Inputs
            const [newStaffName, setNewStaffName] = useState('');
            const [newCatName, setNewCatName] = useState('');
            const [editingCatName, setEditingCatName] = useState(null);
            const [editingCatValue, setEditingCatValue] = useState('');
            
            const [newIngName, setNewIngName] = useState('');
            const [editingIngName, setEditingIngName] = useState(null);
            const [editingIngValue, setEditingIngValue] = useState('');

            const [formData, setFormData] = useState({ name: '', category: '', ingredients: [{ name: '', amount: '' }], steps: '' });
            const [quickTaskName, setQuickTaskName] = useState('');
            const [quickTaskStaff, setQuickTaskStaff] = useState('');

            // ---------------------------------------------------------
            // ☁️ CLOUD SYNC LOGIC
            // ---------------------------------------------------------
            useEffect(() => {
                if (isLogged && db && storeCode) {
                    const docRef = db.collection('stores').doc(storeCode);
                    const unsubscribe = docRef.onSnapshot((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.items) setItems(data.items);
                            if (data.categories) setCategories(data.categories);
                            if (data.staffList) setStaffList(data.staffList);
                            if (data.queue) setQueue(data.queue);
                            if (data.masterIngredients) setMasterIngredients(data.masterIngredients);
                        } else {
                            docRef.set({ items, categories, staffList, queue, masterIngredients, createdAt: new Date() });
                        }
                    });
                    return () => unsubscribe();
                } else if (isLogged) {
                    localStorage.setItem('dose_sop_data_v9', JSON.stringify(items));
                    localStorage.setItem('dose_categories_v9', JSON.stringify(categories));
                    localStorage.setItem('dose_staff_v9', JSON.stringify(staffList));
                    localStorage.setItem('dose_queue_v9', JSON.stringify(queue));
                    localStorage.setItem('dose_ingredients_v9', JSON.stringify(masterIngredients));
                }
            }, [isLogged, storeCode, db]);

            const syncToCloud = (payload) => {
                if (isLogged && db && storeCode) {
                    db.collection('stores').doc(storeCode).set(payload, { merge: true }).catch(err => console.error("Sync Error:", err));
                }
            };

            const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3000); };

            // 🔐 Login Handlers
            const handleLogin = (e) => {
                e.preventDefault();
                const code = loginInput.trim().toUpperCase();
                if (code.length < 4) return alert("รหัสร้านต้องมี 4 ตัวอักษรขึ้นไป");
                localStorage.setItem('dose_store_code', code);
                setStoreCode(code); setIsLogged(true);
            };
            const handleLogout = () => {
                if(window.confirm('ออกจากระบบร้านค้านี้ใช่หรือไม่?')) {
                    localStorage.removeItem('dose_store_code');
                    setStoreCode(''); setIsLogged(false);
                }
            };

            // --- Handlers ---
            const openModal = (item = null) => {
                if (item) {
                    setEditingItem(item.id);
                    const safeIngredients = Array.isArray(item.ingredients) && item.ingredients.length > 0 ? item.ingredients : [{name: '', amount: ''}];
                    setFormData({ ...item, ingredients: safeIngredients });
                } else {
                    setEditingItem(null);
                    setFormData({ name: '', category: '', ingredients: [{ name: '', amount: '' }], steps: '' });
                }
                setIsModalOpen(true);
            };

            const handleIngredientChange = (index, field, value) => {
                const newIngredients = [...formData.ingredients];
                newIngredients[index][field] = value;
                setFormData({ ...formData, ingredients: newIngredients });
            };
            const addIngredientRow = () => setFormData({ ...formData, ingredients: [...formData.ingredients, { name: '', amount: '' }] });
            const removeIngredientRow = (index) => setFormData({ ...formData, ingredients: formData.ingredients.filter((_, i) => i !== index) });

            const saveItem = (e) => {
                e.preventDefault();
                const cleanIngredients = formData.ingredients.filter(ing => ing.name && ing.name.trim() !== '');
                const newItem = { ...formData, name: formData.name.trim() || 'ไม่มีชื่อ', category: formData.category || 'ไม่ระบุหมวดหมู่', ingredients: cleanIngredients, id: editingItem || Date.now(), type: activeTab === 'recipes' ? 'recipe' : 'task' };
                
                const newItemsList = editingItem ? items.map(item => item.id === editingItem ? newItem : item) : [newItem, ...items];
                setItems(newItemsList);
                syncToCloud({ items: newItemsList }); 
                setIsModalOpen(false); showToast(`✅ บันทึก "${newItem.name}" แล้ว`);
            };

            const executeDelete = () => { 
                const newItems = items.filter(item => item.id !== confirmDeleteId);
                setItems(newItems); syncToCloud({ items: newItems }); 
                setConfirmDeleteId(null); showToast('🗑️ ลบรายการสำเร็จ'); 
            };

            const addStaff = () => { 
                if (newStaffName.trim()) { 
                    const newList = [...staffList, { id: Date.now(), name: newStaffName }];
                    setStaffList(newList); syncToCloud({ staffList: newList }); setNewStaffName(''); 
                } 
            };
            const removeStaff = (id) => {
                const newList = staffList.filter(s => s.id !== id);
                setStaffList(newList); syncToCloud({ staffList: newList });
            };

            const addCategory = () => { 
                if (newCatName.trim() && !categories.includes(newCatName.trim())) { 
                    const newCats = [...categories, newCatName.trim()];
                    setCategories(newCats); syncToCloud({ categories: newCats }); setNewCatName(''); 
                } 
            };
            const removeCategory = (catToRemove) => {
                const newCats = categories.filter(c => c !== catToRemove);
                setCategories(newCats); syncToCloud({ categories: newCats });
            };
            const saveEditCategory = () => {
                if (!editingCatValue.trim() || editingCatValue.trim() === editingCatName) return setEditingCatName(null);
                const newName = editingCatValue.trim();
                const newCats = categories.map(c => c === editingCatName ? newName : c);
                const newItems = items.map(item => item.category === editingCatName ? { ...item, category: newName } : item);
                setCategories(newCats); setItems(newItems);
                syncToCloud({ categories: newCats, items: newItems });
                if (selectedCategoryFilter === editingCatName) setSelectedCategoryFilter(newName);
                setEditingCatName(null);
            };

            const addIngredientMaster = () => { 
                if (newIngName.trim() && !masterIngredients.includes(newIngName.trim())) { 
                    const newIngs = [...masterIngredients, newIngName.trim()];
                    setMasterIngredients(newIngs); syncToCloud({ masterIngredients: newIngs }); setNewIngName(''); 
                } 
            };
            const removeIngredientMaster = (ingToRemove) => {
                const newIngs = masterIngredients.filter(c => c !== ingToRemove);
                setMasterIngredients(newIngs); syncToCloud({ masterIngredients: newIngs });
            };
            const saveEditIngredientMaster = () => {
                if (!editingIngValue.trim() || editingIngValue.trim() === editingIngName) return setEditingIngName(null);
                const newName = editingIngValue.trim();
                const newIngs = masterIngredients.map(c => c === editingIngName ? newName : c);
                const newItems = items.map(item => {
                    if (!item.ingredients) return item;
                    const updatedIngs = item.ingredients.map(ing => ing.name === editingIngName ? { ...ing, name: newName } : ing);
                    return { ...item, ingredients: updatedIngs };
                });
                setMasterIngredients(newIngs); setItems(newItems);
                syncToCloud({ masterIngredients: newIngs, items: newItems });
                setEditingIngName(null);
            };

            const addToQueue = (staffId) => {
                const staff = staffList.find(s => s.id === staffId);
                const newQueue = [{ qId: Date.now() + Math.random(), item: assigningItem, staffName: staff ? staff.name : 'ไม่ระบุ', status: 'pending', isPriority: false, timestamp: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) }, ...queue];
                setQueue(newQueue); syncToCloud({ queue: newQueue });
                setAssigningItem(null); setActiveTab('queue'); showToast(`✅ ส่งเข้าคิวแล้ว!`);
            };

            const addAdHocTask = (e) => {
                e.preventDefault();
                if(!quickTaskName.trim()) return;
                const newQueue = [{ qId: Date.now() + Math.random(), item: { name: quickTaskName.trim(), type: 'task', id: 'adhoc' }, staffName: quickTaskStaff || 'ใครก็ได้', status: 'pending', isPriority: false, timestamp: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) }, ...queue];
                setQueue(newQueue); syncToCloud({ queue: newQueue }); setQuickTaskName(''); showToast(`⚡ เพิ่มงานด่วนแล้ว!`);
            };

            const togglePriority = (qId) => {
                const newQueue = queue.map(q => q.qId === qId ? { ...q, isPriority: !q.isPriority } : q);
                setQueue(newQueue); syncToCloud({ queue: newQueue });
            };
            const markQueueDone = (qId) => {
                const newQueue = queue.map(q => q.qId === qId ? { ...q, status: 'done' } : q);
                setQueue(newQueue); syncToCloud({ queue: newQueue });
            };
            const removeQueue = (qId) => {
                const newQueue = queue.filter(q => q.qId !== qId);
                setQueue(newQueue); syncToCloud({ queue: newQueue });
            };
            const undoQueueDone = (qId) => {
                const newQueue = queue.map(q => q.qId === qId ? { ...q, status: 'pending' } : q);
                setQueue(newQueue); syncToCloud({ queue: newQueue });
            };

            // 🌟 NEW: ฟังก์ชันสลับสถานะกาง/หด คิวงาน
            const toggleExpandQueue = (qId) => {
                setExpandedQIds(prev => 
                    prev.includes(qId) ? prev.filter(id => id !== qId) : [...prev, qId]
                );
            };

            const filteredItems = useMemo(() => {
                let filtered = items.filter(item => (activeTab === 'recipes' ? item.type === 'recipe' : item.type === 'task'));
                if (selectedCategoryFilter !== 'All') filtered = filtered.filter(item => item.category === selectedCategoryFilter);
                if (searchQuery) filtered = filtered.filter(item => (item.name || '').toLowerCase().includes(searchQuery.toLowerCase()));
                return filtered;
            }, [items, activeTab, searchQuery, selectedCategoryFilter]);

            const displayQueue = useMemo(() => {
                let q = queue;
                if (queueStaffFilter !== 'All') q = q.filter(item => item.staffName === queueStaffFilter);
                return q.sort((a, b) => {
                    if (a.status === 'done' && b.status !== 'done') return 1;
                    if (a.status !== 'done' && b.status === 'done') return -1;
                    if (a.isPriority && !b.isPriority) return -1;
                    if (!a.isPriority && b.isPriority) return 1;
                    return 0;
                });
            }, [queue, queueStaffFilter]);

            // ---------------------------------------------------------
            // 🖥️ UI RENDER: Login Screen
            // ---------------------------------------------------------
            if (!isLogged) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-white max-w-md w-full rounded-3xl p-8 shadow-2xl text-center">
                            <div className="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6"><span className="text-4xl">☕</span></div>
                            <h1 className="text-3xl font-black text-slate-800 mb-2">DOSE SOP</h1>
                            <p className="text-slate-500 mb-8 font-medium">กรุณาใส่ "รหัสสาขา" เพื่อเชื่อมต่อข้อมูล</p>
                            <form onSubmit={handleLogin}>
                                <input type="text" value={loginInput} onChange={e => setLoginInput(e.target.value)} placeholder="เช่น DOSE99" className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-xl text-center text-xl font-bold uppercase focus:border-amber-500 outline-none mb-4 tracking-widest" required />
                                <button type="submit" className="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white rounded-xl font-black text-lg shadow-lg">เข้าสู่ระบบ</button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ---------------------------------------------------------
            // 🖥️ UI RENDER: Main App
            // ---------------------------------------------------------
            return (
                <div className="min-h-screen pb-24 relative animate-fade-in">
                    {toast && (<div className="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl font-bold flex items-center gap-2 z-[100] animate-toast whitespace-nowrap">{toast}</div>)}

                    <div className="glass-header sticky top-0 z-10 px-4 py-3 md:px-8 flex justify-between items-center shadow-sm">
                        <div className="mr-2">
                            <h1 className="text-xl font-black text-amber-800 tracking-tight flex items-center gap-2">
                                ☕ DOSE 
                                {isOnlineMode ? <span className="bg-green-100 text-green-700 text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider font-bold">Cloud Sync</span> : <span className="bg-slate-200 text-slate-500 text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider font-bold">Offline</span>}
                            </h1>
                            <p className="text-xs font-bold text-slate-500 mt-1">สาขา: <span className="text-slate-800">{storeCode}</span></p>
                        </div>
                        
                        <div className="flex gap-1.5 sm:gap-2">
                            <button onClick={() => setIsCatManageModalOpen(true)} className="bg-white border-2 border-slate-200 text-slate-600 p-2 sm:px-3 sm:py-1.5 rounded-xl font-bold hover:text-amber-600 shadow-sm text-sm" title="จัดการหมวดหมู่">
                                📁<span className="hidden md:inline"> หมวดหมู่</span>
                            </button>
                            <button onClick={() => setIsIngManageModalOpen(true)} className="bg-white border-2 border-slate-200 text-slate-600 p-2 sm:px-3 sm:py-1.5 rounded-xl font-bold hover:text-amber-600 shadow-sm text-sm" title="จัดการวัตถุดิบ">
                                📦<span className="hidden md:inline"> วัตถุดิบ</span>
                            </button>
                            <button onClick={() => setIsStaffModalOpen(true)} className="bg-white border-2 border-slate-200 text-slate-600 p-2 sm:px-3 sm:py-1.5 rounded-xl font-bold hover:text-indigo-600 shadow-sm text-sm" title="จัดการพนักงาน">
                                👥<span className="hidden md:inline"> พนักงาน</span>
                            </button>
                            <button onClick={handleLogout} className="text-[10px] sm:text-xs font-bold text-red-500 bg-red-50 px-2 sm:px-3 py-2 sm:py-1.5 rounded-lg hover:bg-red-100 whitespace-nowrap">
                                ออกระบบ
                            </button>
                        </div>
                    </div>

                    <div className="max-w-5xl mx-auto px-4 mt-6 space-y-5">
                        <div className="flex bg-slate-200 p-1.5 rounded-xl overflow-x-auto hide-scrollbar">
                            <button onClick={() => {setActiveTab('recipes'); setSelectedCategoryFilter('All');}} className={`flex-1 min-w-[120px] py-2.5 rounded-lg font-bold text-sm transition-all ${activeTab === 'recipes' ? 'bg-white text-amber-800 shadow' : 'text-slate-500'}`}>📖 สูตร</button>
                            <button onClick={() => {setActiveTab('tasks'); setSelectedCategoryFilter('All');}} className={`flex-1 min-w-[120px] py-2.5 rounded-lg font-bold text-sm transition-all ${activeTab === 'tasks' ? 'bg-white text-indigo-700 shadow' : 'text-slate-500'}`}>💼 หน้าที่</button>
                            <button onClick={() => setActiveTab('queue')} className={`flex-1 min-w-[120px] py-2.5 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-2 ${activeTab === 'queue' ? 'bg-white text-red-600 shadow' : 'text-slate-500'}`}>
                                🔔 คิวงาน {queue.filter(q => q.status === 'pending').length > 0 && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full">{queue.filter(q => q.status === 'pending').length}</span>}
                            </button>
                        </div>

                        {activeTab === 'queue' ? (
                            <div className="space-y-4 animate-slide-up">
                                <div className="bg-white p-4 rounded-2xl border-2 border-slate-200 shadow-sm flex flex-col gap-4">
                                    <form onSubmit={addAdHocTask} className="flex flex-col sm:flex-row gap-2 w-full">
                                        <input type="text" placeholder="⚡ งานด่วน (เช่น เช็ดโต๊ะ)..." value={quickTaskName} onChange={e=>setQuickTaskName(e.target.value)} className="flex-1 min-w-0 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold" />
                                        <div className="flex gap-2">
                                            <select value={quickTaskStaff} onChange={e=>setQuickTaskStaff(e.target.value)} className="flex-1 sm:w-32 min-w-0 p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none text-sm font-bold">
                                                <option value="">ใครก็ได้</option>
                                                {staffList.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
                                            </select>
                                            <button type="submit" className="shrink-0 bg-amber-500 text-white px-5 rounded-xl font-bold hover:bg-amber-600 text-sm shadow-sm">เพิ่ม</button>
                                        </div>
                                    </form>
                                    <div className="pt-3 border-t border-slate-100 flex items-center w-full">
                                        <span className="text-sm font-bold text-slate-400 mr-2 hidden sm:inline">ตัวกรอง:</span>
                                        <select value={queueStaffFilter} onChange={e=>setQueueStaffFilter(e.target.value)} className="w-full sm:w-auto p-3 bg-white border border-slate-300 text-indigo-700 rounded-xl outline-none text-sm font-bold">
                                            <option value="All">🔍 ดูคิวทั้งหมด</option>
                                            {staffList.map(s => <option key={s.id} value={s.name}>ของ: {s.name}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center mb-2 mt-4">
                                    <h2 className="text-xl font-black text-slate-800">📋 คิวงานปัจจุบัน</h2>
                                    <button onClick={() => {setQueue(queue.filter(q => q.status !== 'done')); syncToCloud({queue: queue.filter(q => q.status !== 'done')});}} className="text-sm font-bold text-slate-400 hover:text-red-500">ล้างคิวที่เสร็จแล้ว</button>

                                        </select>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                        <div className="flex justify-between items-center mb-3">
                                            <label className="block text-sm font-bold text-slate-700">{activeTab === 'recipes' ? 'รายการส่วนผสม' : 'รายการอุปกรณ์'}</label>
                                        </div>
                                        {formData.ingredients.map((ing, index) => (
                                            <div key={index} className="flex gap-2 mb-2 items-start w-full">
                                                <select value={ing.name} onChange={(e) => {
                                                    if (e.target.value === '__MANAGE__') setIsIngManageModalOpen(true);
                                                    else handleIngredientChange(index, 'name', e.target.value);
                                                }} className="flex-[3] min-w-0 p-2.5 bg-white border border-slate-300 rounded-lg outline-none text-sm text-slate-600 truncate">
                                                    <option value="">-- ไม่ระบุ --</option>
                                                    {masterIngredients.map(mIng => <option key={mIng} value={mIng}>{mIng}</option>)}
                                                    <option value="__MANAGE__" className="font-bold text-amber-600 bg-amber-50">⚙️ จัดการวัตถุดิบ (เพิ่ม/ลด/แก้)...</option>
                                                </select>
                                                <input type="text" value={ing.amount} onChange={(e) => handleIngredientChange(index, 'amount', e.target.value)} className="flex-[2] min-w-0 p-2.5 bg-white border border-slate-300 rounded-lg outline-none text-sm" placeholder="ปริมาณ" />
                                                <button type="button" onClick={() => removeIngredientRow(index)} className="shrink-0 p-2.5 px-3 text-slate-400 bg-white border border-slate-200 rounded-lg">✕</button>
                                            </div>
                                        ))}
                                        <button type="button" onClick={addIngredientRow} className="mt-2 text-sm font-bold text-amber-600">+ เพิ่มบรรทัด</button>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-slate-700 mb-1">วิธีทำ (Steps)</label>
                                        <textarea rows="4" value={formData.steps} onChange={e => setFormData({...formData, steps: e.target.value})} className="w-full p-3 border-2 border-slate-200 rounded-lg focus:border-amber-500 outline-none" placeholder="สามารถปล่อยว่างได้..."></textarea>
                                    </div>
                                    <div className="pt-4 border-t border-slate-100 flex gap-3">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200">ยกเลิก</button>
                                        <button type="submit" className="flex-1 py-3 bg-amber-500 text-white font-bold rounded-xl shadow-md">💾 บันทึกข้อมูล</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 7. Delete Confirm Modal */}
                    {confirmDeleteId && (
                        <div className="fixed inset-0 bg-slate-900/60 z-[80] flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center animate-slide-up">
                                <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">🗑️</div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">ลบรายการนี้?</h3>
                                <div className="flex gap-3 mt-6">
                                    <button onClick={() => setConfirmDeleteId(null)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200">ยกเลิก</button>
                                    <button onClick={executeDelete} className="flex-1 py-3 bg-red-500 text-white font-bold rounded-xl hover:bg-red-600">ลบทิ้ง</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
